[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-system"
version = "0.1.0"
description = "Physical AI Development System: Imitation Learning, RL (DAPG/RLPD/AWAC), MuJoCo Evaluation & Paper Text Mining"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "torch>=2.3.0",
    "mujoco>=3.1.6",
    "imageio[ffmpeg]>=2.34.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
